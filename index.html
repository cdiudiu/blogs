<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google 核心 SEO Meta 标签 -->
    <meta name="description" content="vpsbbc.com（VPS帮帮车）专注于 VPS 选购指南、服务器性能评测、科学上网及 Linux 常用脚本教程分享。">

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="canonical" href="https://blog.vpsbbc.com/">
    <!-- 网站 Favicon 图标 -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <!-- Open Graph (社交与搜索引擎卡片) -->
    <meta property="og:locale" content="zh_CN">
    <meta property="og:type" content="website">
    <meta property="og:title" content="vpsbbc.com - VPS帮帮车">
    <meta property="og:description" content="专注 VPS 选购指南、网络优化与服务器极客玩法。">
    <meta property="og:url" content="https://blog.vpsbbc.com/">
    <meta property="og:site_name" content="VPS帮帮车">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="vpsbbc.com - VPS帮帮车">
    <meta name="twitter:description" content="专注 VPS 选购指南、网络优化与服务器极客玩法。">

    <!-- Google 结构化数据 (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VPS帮帮车 成也的博客",
      "alternateName": ["成也博客","vpsbbc.com", "vpsbbc"],
      "url": "https://blog.vpsbbc.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://blog.vpsbbc.com/#/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #eef7fa;
        }

        .code-block-wrapper {
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: #9ca3af;
            border: 1px solid rgba(156, 163, 175, 0.15);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        #post-toc-container {
            position: relative;
            scroll-behavior: smooth;
        }

        .toc-group {
            margin-bottom: 2px;
        }

        .toc-sub-list {
            display: block !important;
        }

        .toc-link {
            color: #71717a !important;
            font-weight: 400 !important;
            border-left: 2px solid transparent;
        }

        .toc-link:hover {
            color: #27272a !important;
            background-color: #f4f4f5 !important;
        }

        .toc-link.is-active {
            color: #b45309 !important;
            font-weight: 500 !important;
            background-color: rgba(245, 158, 11, 0.05) !important;
            border-left: 2px solid #f59e0b !important;
            padding-left: calc(var(--base-pad) - 2px) !important;
        }
    </style>
</head>

<body class="text-zinc-800 min-h-screen flex flex-col antialiased">

                        <div
                            class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-zinc-100/80 pb-5">

                                    class="text-zinc-400 text-xs sm:text-sm mt-1.5 leading-relaxed"></p>

                                        </path>
                                    </svg>
                                </a>
                            </div>
                        </div>

                        <nav aria-label="大系列导航" class="flex items-center gap-2 pt-0.5">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-zinc-400 shrink-0">系列
                                ➔</span>
                            <div id="series-navbar-container" class="flex flex-wrap gap-2 text-xs font-semibold"></div>

                    <section aria-label="文章列表">

                <nav aria-label="文章分页" id="pagination-container" class="flex justify-center items-center gap-1.5 pt-10">

            </div>

            <aside class="space-y-6">
                <section aria-label="文章搜索" class="bg-white p-5 rounded-2xl border border-zinc-100 shadow-sm space-y-3">
                    <h2 class="text-xs font-bold uppercase tracking-widest text-zinc-400">文章检索</h2>
                    <div class="relative">
                        <input type="text" id="search-input" onkeydown="handleSearch(event)"
                            class="w-full border border-zinc-200 rounded-xl pl-4 pr-10 py-2.5 text-xs focus:ring-2 focus:ring-amber-500/10 focus:border-amber-500 focus:outline-none transition-all"
                            placeholder="输入关键字并按回车搜索..." aria-label="搜索关键字">
                        <button onclick="triggerSearch()"
                            class="absolute right-3.5 top-3 text-zinc-400 hover:text-zinc-600 text-xs"
                            aria-label="点击搜索">🔍</button>
                    </div>
                </section>

                <section aria-label="热门文章推荐"
                    class="bg-white p-5 rounded-2xl border border-zinc-100 shadow-sm space-y-4">
                    <div class="border-b border-zinc-100 pb-2 flex items-center justify-between">
                        <h2 class="text-xs font-bold uppercase tracking-widest text-zinc-400">🔥 热门文章</h2>
                        <span id="popular-top-badge"
                            class="text-[10px] bg-amber-50 text-amber-600 px-1.5 py-0.5 rounded font-bold">TOP 5</span>

        </div>

        <!-- 文章详情页 -->
        <div id="post-view" class="hidden max-w-7xl mx-auto">

                class="flex items-center justify-between bg-white px-6 py-3.5 rounded-2xl border border-zinc-100 shadow-sm mb-6">
                <a href="#/"
                    class="text-xs font-semibold uppercase tracking-wider text-zinc-500 hover:text-amber-500 flex items-center gap-1.5 transition-colors">
                    ← 返回首页

                <div class="flex items-center gap-3">

                    <a href="./admin.html" class="text-zinc-300 hover:text-amber-500 p-1 transition-colors"
                        title="管理控制台" aria-label="管理控制台">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </a>
                </div>
            </nav>

            <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 items-start">
                <main class="lg:col-span-3 bg-white p-6 sm:p-8 rounded-2xl border border-zinc-100 shadow-sm">
                    <header class="border-b border-zinc-100 pb-5 mb-6">
                        <h1 id="detail-post-title"
                            class="text-2xl sm:text-3xl font-extrabold tracking-tight text-zinc-900 leading-tight mb-3">

                        <div class="text-xs text-zinc-400 flex flex-wrap items-center gap-4">

                    <article id="post-content"
                        class="prose prose-zinc prose-amber max-w-none 
                        prose-headings:font-bold prose-headings:tracking-tight
                        prose-img:rounded-xl prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-zinc-100
                        prose-pre:bg-[#0d1117] prose-pre:border prose-pre:border-zinc-800 prose-pre:rounded-xl prose-pre:p-0"></article>
                </main>

                <aside aria-label="正文目录" class="hidden lg:block lg:col-span-1 sticky top-6">
                    <div class="bg-white p-5 rounded-2xl border border-zinc-100 shadow-sm space-y-3">
                        <div class="flex items-center space-x-2 border-b border-zinc-100 pb-3">
                            <span class="text-sm">📑</span>
                            <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-700">目录导航</h2>

                            class="max-h-[calc(100vh-100px)] overflow-y-auto space-y-1 text-xs text-zinc-500 pr-1">

    <footer class="bg-white border-t border-zinc-100 py-10 mt-auto text-xs text-zinc-400 tracking-wide">
        <div
            class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 bg-amber-500 rounded-full inline-block"></span>
                <span>blog.vpsbbc.com • 技术分享</span>
            </div>
            <div class="text-[11px] text-zinc-400">
                Powered by <a href="https://vpsbbc.com" target="_blank" rel="noopener"
                    class="hover:underline text-amber-500">vpsbbc.com</a>
            </div>
        </div>
    </footer>

    <script>
        let R2_DOMAIN = "";
        let currentFilterSeries = "";
        let currentFilterCategory = "";
        let currentSearchQuery = "";

        let activeCategories = [];
        let activeSeriesList = [];
        let dbNavMeta = {};
        let currentPageNum = 1;
        let globalLayoutMode = "standard";
        let globalPopularLimit = 5;
        let siteBaseTitle = "vpsbbc.com - VPS帮帮车";

        marked.setOptions({
            highlight: function (code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-'
        });

        window.addEventListener('hashchange', handleRouting);
        window.addEventListener('load', async () => {
            await loadSiteConfig();
            await fetchNavMeta();
            handleRouting();
        });

        function handleRouting() {
            const hash = window.location.hash;
            const pathname = window.location.pathname;

            if (pathname.startsWith('/post/')) {
                const postId = pathname.replace('/post/', '').replace(/\/$/, '');
                if (postId) {
                    loadPost(postId);
                    return;
                }
            }

            if (hash.startsWith('#/post/')) {
                const postId = hash.replace('#/post/', '');
                loadPost(postId);
            } else if (hash.startsWith('#/series/')) {
                const seriesName = decodeURIComponent(hash.replace('#/series/', ''));
                showSeriesView(seriesName);
            } else {
                showHomeView();
            }
        }

        async function loadSiteConfig() {
            try {
                const res = await fetch('./api/config?_t=' + Date.now());
                if (!res.ok) throw new Error();
                const data = await res.json();

                const title = data.site_title || "vpsbbc.com - VPS帮帮车";
                const subtitle = data.site_subtitle || "无服务器数字花园";
                siteBaseTitle = title;

                activeCategories = JSON.parse(data.site_categories || '["技术","教程","随笔","思考"]');
                activeSeriesList = JSON.parse(data.site_series || '["科学上网","谷歌系列","NAS系列"]');
                const rawNavLinks = JSON.parse(data.site_nav_links || '[{"name": "订阅转换", "url": "https://sub.blogs.nyc.mn"}]');
                globalLayoutMode = data.site_layout_mode || "standard";

                globalPopularLimit = parseInt(data.site_popular_limit) || 5;
                R2_DOMAIN = data.site_r2_domain || "";

                document.title = title;
                document.getElementById('site-title-display').innerText = title;
                document.getElementById('site-subtitle-display').innerText = subtitle;

                const badge = document.getElementById('popular-top-badge');
                if (badge) badge.innerText = `TOP ${globalPopularLimit}`;
                // 在 loadSiteConfig() 解析完 data 后执行：
                if (data.site_favicon) {
                    let iconLink = document.querySelector("link[rel~='icon']");
                    if (!iconLink) {
                        iconLink = document.createElement('link');
                        iconLink.rel = 'icon';
                        document.head.appendChild(iconLink);
                    }
                    iconLink.href = data.site_favicon;

                    let appleIcon = document.querySelector("link[rel='apple-touch-icon']");
                    if (!appleIcon) {
                        appleIcon = document.createElement('link');
                        appleIcon.rel = 'apple-touch-icon';
                        document.head.appendChild(appleIcon);
                    }
                    appleIcon.href = data.site_favicon;
                }
                renderCustomNavbarLinks(rawNavLinks);

            } catch (err) {
                console.error("加载全局配置出错:", err);
                activeCategories = ["技术", "教程", "随笔", "思考"];
                activeSeriesList = ["科学上网", "谷歌系列", "NAS系列"];
                document.title = "vpsbbc.com - VPS帮帮车";
            }
        }

        function renderCustomNavbarLinks(linksArray) {
            const containers = [
                document.getElementById('custom-navbar-links'),
                document.getElementById('post-view-tools')
            ];
            containers.forEach(container => {
                if (!container) return;
                container.innerHTML = '';
                linksArray.forEach(item => {
                    container.innerHTML += `
                        <a href="${item.url}" target="_blank" rel="noopener" class="text-zinc-500 hover:text-amber-500 transition-colors px-2 py-1 rounded-md hover:bg-zinc-50">${item.name}</a>
                    `;
                });
            });
        }

        async function fetchNavMeta() {
            try {
                const res = await fetch('./api/posts?get_nav_meta=true&_t=' + Date.now());
                dbNavMeta = await res.json();

                const finalSeriesList = Array.from(new Set([...activeSeriesList, ...Object.keys(dbNavMeta)]));
                const navContainer = document.getElementById('series-navbar-container');
                if (!navContainer) return;
                navContainer.innerHTML = '';

                const isAllSelected = !currentFilterSeries;
                navContainer.innerHTML += `
                    <a href="#/" class="px-2.5 py-1 rounded-md transition-all ${isAllSelected ? 'bg-amber-500 text-white font-bold' : 'text-zinc-600 bg-zinc-100/70 hover:bg-zinc-100 hover:text-zinc-900'}">全部</a>
                `;

                finalSeriesList.forEach(series => {
                    const isSelected = currentFilterSeries === series;
                    navContainer.innerHTML += `
                        <a href="#/series/${encodeURIComponent(series)}" class="px-2.5 py-1 rounded-md transition-all ${isSelected ? 'bg-amber-500 text-white font-bold' : 'text-zinc-600 bg-zinc-100/70 hover:bg-zinc-100 hover:text-zinc-900'}">${series}</a>
                    `;
                });
            } catch (e) {
                console.error("生成导航元数据出错:", e);
            }
        }

        function updateMeta(title, description, canonicalUrl) {
            document.title = title;
            let descTag = document.querySelector('meta[name="description"]');
            if (descTag) descTag.setAttribute('content', description || '');
            let canonTag = document.querySelector('link[rel="canonical"]');
            if (canonTag) canonTag.setAttribute('href', canonicalUrl || window.location.href);
        }

        async function handleSearch(e) {
            if (e.key === 'Enter') {
                await triggerSearch();
            }
        }

        async function triggerSearch() {
            currentSearchQuery = document.getElementById('search-input').value.trim();
            currentPageNum = 1;
            await fetchPostsAndRender(1);
        }

        async function showHomeView() {
            currentFilterSeries = "";
            currentFilterCategory = "";
            currentSearchQuery = "";
            const sInput = document.getElementById('search-input');
            if (sInput) sInput.value = "";

            updateMeta(siteBaseTitle, "vpsbbc.com（VPS帮帮车）专注于 VPS 选购指南、服务器性能评测、科学上网及 Linux 常用脚本教程分享。", `${window.location.origin}/`);

            await fetchNavMeta();

            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('post-view').classList.add('hidden');

            await fetchPostsAndRender(1);
            await fetchPopularPosts();
        }

        async function showSeriesView(seriesName) {
            currentFilterSeries = seriesName;
            currentFilterCategory = "";
            currentSearchQuery = "";
            const sInput = document.getElementById('search-input');
            if (sInput) sInput.value = "";

            updateMeta(`${seriesName} - ${siteBaseTitle}`, `浏览关于 ${seriesName} 的所有精选教程和服务器评测指南。`, `${window.location.origin}/#/series/${encodeURIComponent(seriesName)}`);

            await fetchNavMeta();

            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('post-view').classList.add('hidden');

            await fetchPostsAndRender(1);
            await fetchPopularPosts();
        }

        async function fetchPostsAndRender(page = 1) {
            currentPageNum = page;
            const container = document.getElementById('posts-list-container');
            if (!container) return;
            container.innerHTML = '<p class="text-zinc-400 text-sm">正在加载中...</p>';

            try {
                let url = `./api/posts?page=${page}&limit=12&_t=${Date.now()}`;
                if (currentFilterCategory) url += `&category=${encodeURIComponent(currentFilterCategory)}`;
                if (currentFilterSeries) url += `&series=${encodeURIComponent(currentFilterSeries)}`;
                if (currentSearchQuery) url += `&q=${encodeURIComponent(currentSearchQuery)}`;

                const response = await fetch(url);
                const resData = await response.json();

                const posts = resData.results;
                const total = resData.total;
                const limit = resData.limit;

                container.innerHTML = '';

                if (posts.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-zinc-400 text-sm py-12 text-center">暂无发布内容。</div>';
                    document.getElementById('pagination-container').innerHTML = '';
                    return;
                }

                posts.forEach((post, index) => {
                    // 补充 loading="lazy" 与 decoding="async" 优化 Google Core Web Vitals
                    const coverHtml = post.cover
                        ? `<img src="${post.cover}" 
                                loading="lazy" 
                                decoding="async" 
                                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 rounded-t-2xl" 
                                alt="${post.title} 封面配图"
                                onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                           <div class="hidden w-full h-full bg-gradient-to-tr ${getGradient(index)} items-center justify-center text-white/10 font-bold text-3xl select-none rounded-t-2xl">BLOGS</div>`
                        : `<div class="w-full h-full bg-gradient-to-tr ${getGradient(index)} flex items-center justify-center text-white/10 font-bold text-3xl select-none rounded-t-2xl">BLOGS</div>`;

                    const summaryHtml = (globalLayoutMode !== 'simple')
                        ? `<p class="text-zinc-500 text-xs leading-relaxed line-clamp-2">${post.summary}</p>`
                        : '';

                    const titleClass = (globalLayoutMode === 'simple')
                        ? "text-sm font-bold text-zinc-900 line-clamp-3 group-hover:text-amber-500 transition-colors"
                        : "text-sm font-bold text-zinc-900 line-clamp-1 group-hover:text-amber-500 transition-colors";

                    container.innerHTML += `
                        <article class="group bg-white rounded-2xl border border-zinc-100 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-300 overflow-hidden flex flex-col justify-between">
                            <div>
                                <a href="./post/${post.id}" class="block aspect-video w-full overflow-hidden relative bg-zinc-50 rounded-t-2xl transform translate-z-0 isolate" aria-label="查看文章：${post.title}">
                                    ${coverHtml}
                                    <span class="absolute top-3 left-3 bg-zinc-900/80 text-white text-[10px] font-bold px-2 py-0.5 rounded backdrop-blur-sm uppercase z-10">${post.category || '未分类'}</span>
                                </a>
                                <div class="p-5 space-y-2">
                                    <h2 class="${titleClass}">
                                        <a href="./post/${post.id}" title="${post.title}">${post.title}</a>
                                    </h2>
                                    ${summaryHtml}
                                </div>
                            </div>
                            <div class="px-5 pb-5 pt-2 border-t border-zinc-50 flex items-center justify-between text-[10px] text-zinc-400">
                                <time datetime="${post.date}">📅 ${post.date}</time>
                                <span>👁️ ${post.views}</span>
                            </div>
                        </article>
                    `;
                });

                renderPagination(total, limit, page);

            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-red-500 text-sm text-center">获取文章数据失败，请确认配置。</div>`;
            }
        }

        function renderPagination(total, limit, currentPage) {
            const container = document.getElementById('pagination-container');
            if (!container) return;

            const totalPages = Math.ceil(total / limit);
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let pageHtml = "";

            if (currentPage > 1) {
                pageHtml += `<button onclick="fetchPostsAndRender(${currentPage - 1})" aria-label="上一页" class="px-3.5 py-1.5 text-xs font-semibold bg-[#343a40] text-gray-200 hover:bg-[#495057] active:scale-95 rounded transition-all">« 上一页</button>`;
            }

            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);

            if (startPage > 1) {
                pageHtml += `<button onclick="fetchPostsAndRender(1)" aria-label="前往第 1 页" class="px-3 py-1.5 text-xs font-semibold bg-[#343a40] text-gray-200 hover:bg-[#495057] rounded transition-all">1</button>`;
                if (startPage > 2) {
                    pageHtml += `<span class="px-1 text-zinc-400 text-xs">...</span>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                if (i === currentPage) {
                    pageHtml += `<span aria-current="page" class="px-3 py-1.5 text-xs font-bold bg-amber-500 text-white rounded shadow-sm">${i}</span>`;
                } else {
                    pageHtml += `<button onclick="fetchPostsAndRender(${i})" aria-label="前往第 ${i} 页" class="px-3 py-1.5 text-xs font-semibold bg-[#343a40] text-gray-200 hover:bg-[#495057] rounded transition-all">${i}</button>`;
                }
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    pageHtml += `<span class="px-1 text-zinc-400 text-xs">...</span>`;
                }
                pageHtml += `<button onclick="fetchPostsAndRender(${totalPages})" aria-label="前往最后一页" class="px-3 py-1.5 text-xs font-semibold bg-[#343a40] text-gray-200 hover:bg-[#495057] rounded transition-all">${totalPages}</button>`;
            }

            if (currentPage < totalPages) {
                pageHtml += `<button onclick="fetchPostsAndRender(${currentPage + 1})" aria-label="下一页" class="px-3.5 py-1.5 text-xs font-semibold bg-[#343a40] text-gray-200 hover:bg-[#495057] active:scale-95 rounded transition-all">下一页 »</button>`;
            }

            container.innerHTML = pageHtml;
        }

        async function fetchPopularPosts() {
            const container = document.getElementById('popular-posts-container');
            if (!container) return;
            container.innerHTML = '<p class="text-zinc-400 text-xs">读取中...</p>';

            try {
                const response = await fetch(`./api/posts?popular=${globalPopularLimit}&_t=${Date.now()}`);
                const posts = await response.json();
                container.innerHTML = '';

                if (posts.length === 0) {
                    container.innerHTML = '<p class="text-zinc-400 text-xs">暂无热度统计</p>';
                    return;
                }

                posts.forEach((post, index) => {
                    const thumbHtml = post.cover
                        ? `<img src="${post.cover}" loading="lazy" decoding="async" class="w-full h-full object-cover rounded-md animate-fade-in" alt="${post.title}">`
                        : `<div class="w-full h-full bg-gradient-to-tr ${getGradient(index)} rounded-md"></div>`;

                    container.innerHTML += `
                        <a href="./post/${post.id}" class="flex items-center gap-3 p-1.5 hover:bg-zinc-50 rounded-lg transition-colors group animate-fade-in" title="${post.title}">
                            <div class="w-12 h-12 rounded-md overflow-hidden bg-zinc-100 shrink-0">
                                ${thumbHtml}
                            </div>
                            <div class="min-w-0 flex-grow">
                                <h3 class="text-xs font-bold text-zinc-800 line-clamp-2 leading-snug group-hover:text-amber-500 transition-colors">${post.title}</h3>
                                <div class="text-[9px] text-zinc-400 mt-1 flex justify-between">
                                    <time datetime="${post.date}">${post.date}</time>
                                    <span class="font-bold text-amber-500">👁️ ${post.views}</span>
                                </div>
                            </div>
                        </a>
                    `;
                });
            } catch (e) {
                container.innerHTML = '<p class="text-red-500 text-xs">读取排行失败</p>';
            }
        }

        const gradients = [
            "from-indigo-400 to-purple-500",
            "from-pink-400 to-rose-500",
            "from-cyan-400 to-blue-500",
            "from-emerald-400 to-teal-500",
            "from-amber-400 to-orange-500",
            "from-violet-400 to-purple-500"
        ];
        function getGradient(index) {
            return gradients[index % gradients.length];
        }

        async function loadPost(postId) {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('post-view').classList.remove('hidden');

            const postContent = document.getElementById('post-content');
            postContent.innerHTML = '<p class="text-zinc-400 text-sm">正在加载...</p>';

            try {
                const response = await fetch(`/api/post-content?id=${encodeURIComponent(postId)}&_t=` + Date.now());

                if (!response.ok) throw new Error("无法连接存储桶");
                let text = await response.text();

                if (text.trim().startsWith("<!DOCTYPE") || text.trim().startsWith("<html")) {
                    throw new Error("R2 域名未配置或文章未在 R2 存储桶找到，请检查后台站点全局配置中的【R2 存储桶公网访问域名】！");
                }

                text = text.replace(/^(#{1,6})([^\s#\n])/gm, '$1 $2');

                text = text.replace(/\[card:\s*([\s\S]*?)\s*\]/gi, (match, innerContent) => {
                    const parts = innerContent.split('|').map(s => s.trim());
                    const urlMatch = parts[0].match(/https?:\/\/[^\s"'<>\)]+/i);
                    if (!urlMatch) return match;
                    const url = urlMatch[0];

                    let domain = "";
                    try { domain = new URL(url).hostname; } catch (e) { domain = url; }

                    const customTitle = parts[1] || domain;
                    const customDesc = parts[2] || `点击访问 ${domain} 获取更多详情`;
                    const customImg = parts[3] || `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;

                    return `<div class="my-5 not-prose"><a href="${url}" target="_blank" rel="noopener noreferrer" class="group flex items-center p-3.5 sm:p-4 bg-white hover:bg-zinc-50/80 border border-zinc-200/80 hover:border-zinc-300 rounded-2xl transition-all duration-300 shadow-[0_2px_8px_rgba(0,0,0,0.04)] hover:shadow-md"><div class="w-16 h-16 sm:w-20 sm:h-20 rounded-xl bg-zinc-100 border border-zinc-200/60 overflow-hidden flex items-center justify-center shrink-0 mr-4"><img src="${customImg}" alt="${customTitle}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://www.google.com/s2/favicons?domain=${domain}&sz=128'"></div><div class="flex-grow min-w-0 pr-2"><div class="text-[11px] font-semibold text-zinc-400 uppercase tracking-wider mb-0.5 truncate">${domain}</div><div class="text-sm sm:text-base font-bold text-zinc-900 group-hover:text-blue-600 transition-colors line-clamp-1">${customTitle}</div><div class="text-xs text-zinc-500 mt-1 line-clamp-2 leading-relaxed">${customDesc}</div></div><div class="hidden sm:flex items-center text-zinc-300 group-hover:text-zinc-500 text-sm pl-2 shrink-0 transition-all group-hover:translate-x-0.5">↗</div></a></div>`;
                });

                text = text.replace(/\[youtube:\s*([^\]]+)\s*\]/gi, (match, rawVal) => {
                    let videoId = rawVal.trim();
                    if (videoId.includes("youtube.com/watch?v=")) {
                        videoId = videoId.split("v=")[1].split("&")[0];
                    } else if (videoId.includes("youtu.be/")) {
                        videoId = videoId.split("youtu.be/")[1].split("?")[0];
                    }
                    return `<div class="my-6 not-prose"><div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-md border border-zinc-200/70 bg-black"><iframe src="https://www.youtube-nocookie.com/embed/${videoId}" title="YouTube 视频播放" class="absolute inset-0 w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div></div>`;
                });

                postContent.innerHTML = marked.parse(text);

                // 尝试抓取正文首个 H1/H2 作为文章标题填充
                const detectedTitleEl = postContent.querySelector('h1, h2');
                const pageTitle = detectedTitleEl ? detectedTitleEl.innerText : postId;
                document.getElementById('detail-post-title').innerText = pageTitle;

                // 动态更新文章详情页 SEO
                updateMeta(`${pageTitle} - ${siteBaseTitle}`, pageTitle, `${window.location.origin}/post/${postId}`);

                setTimeout(() => {
                    generateTableOfContents();
                }, 50);

                fetch(`./api/views?id=${postId}`, { method: 'POST' })
                    .then(r => r.json())
                    .then(data => {
                        document.getElementById('post-views-count').innerText = `阅读量: ${data.views}`;
                    }).catch(() => {
                        document.getElementById('post-views-count').innerText = `阅读量: -`;
                    });

                addCopyButtons();
                document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

            } catch (err) {
                postContent.innerHTML = '<p class="text-red-500 text-sm">无法从 R2 载入文章，请确保跨域策略配置成功。</p>';
            }
        }

        let tocObserver = null;

        function generateTableOfContents() {
            const container = document.getElementById('post-toc-container');
            if (!container) return;

            if (tocObserver) {
                tocObserver.disconnect();
                tocObserver = null;
            }

            const postContent = document.getElementById('post-content');
            const headings = postContent.querySelectorAll('h1, h2, h3, h4');

            if (!headings || headings.length === 0) {
                container.innerHTML = `
                    <div class="text-zinc-400 text-xs py-2 leading-relaxed">
                        暂无目录<br>
                        <span class="text-[10px] text-zinc-400">💡 提示：文章中请使用 <code>## 标题</code> 语法排版</span>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            let currentGroupEl = null;
            let currentSubListEl = null;

            headings.forEach((heading, index) => {
                const anchorId = `heading-anchor-${index}`;
                heading.id = anchorId;

                const tagName = heading.tagName.toLowerCase();
                const titleText = heading.innerText.trim();
                const isMainHeading = (tagName === 'h1' || tagName === 'h2');

                const itemLink = document.createElement('a');
                itemLink.href = `#${anchorId}`;
                itemLink.dataset.targetId = anchorId;

                if (isMainHeading) {
                    currentGroupEl = document.createElement('div');
                    currentGroupEl.className = 'toc-group';

                    currentSubListEl = document.createElement('div');
                    currentSubListEl.className = 'toc-sub-list space-y-1 mt-1';

                    itemLink.className = 'toc-link group flex items-center py-1.5 px-2.5 rounded-lg leading-snug transition-all text-zinc-700 font-semibold text-xs hover:text-amber-600 hover:bg-zinc-50';
                    itemLink.style.setProperty('--base-pad', '10px');
                    itemLink.innerHTML = `<span class="truncate" title="${titleText}">${titleText}</span>`;

                    currentGroupEl.appendChild(itemLink);
                    currentGroupEl.appendChild(currentSubListEl);
                    container.appendChild(currentGroupEl);
                } else {
                    const padLeft = tagName === 'h3' ? '20px' : '28px';
                    itemLink.className = 'toc-link group flex items-center py-1 px-2.5 rounded-lg leading-snug transition-all text-zinc-500 text-[11px] hover:text-amber-600 hover:bg-zinc-50';
                    itemLink.style.paddingLeft = padLeft;
                    itemLink.style.setProperty('--base-pad', padLeft);
                    itemLink.innerHTML = `<span class="truncate" title="${titleText}">${titleText}</span>`;

                    if (currentSubListEl) {
                        currentSubListEl.appendChild(itemLink);
                    } else {
                        container.appendChild(itemLink);
                    }
                }

                itemLink.onclick = (e) => {
                    e.preventDefault();
                    heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
                };
            });

            const visibleHeadings = new Map();

            tocObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        visibleHeadings.set(entry.target.id, entry.boundingClientRect.top);
                    } else {
                        visibleHeadings.delete(entry.target.id);
                    }
                });

                if (visibleHeadings.size > 0) {
                    const sorted = Array.from(visibleHeadings.entries()).sort((a, b) => Math.abs(a[1]) - Math.abs(b[1]));
                    const activeId = sorted[0][0];
                    updateActiveToc(activeId);
                }
            }, {
                root: null,
                rootMargin: '0px 0px -60% 0px',
                threshold: 0
            });

            headings.forEach(heading => tocObserver.observe(heading));
        }

        function updateActiveToc(targetId) {
            const allLinks = document.querySelectorAll('#post-toc-container .toc-link');
            const allGroups = document.querySelectorAll('#post-toc-container .toc-group');

            allLinks.forEach(link => link.classList.remove('is-active'));
            allGroups.forEach(group => group.classList.remove('expanded'));

            const activeLink = document.querySelector(`#post-toc-container .toc-link[data-target-id="${targetId}"]`);
            if (!activeLink) return;

            activeLink.classList.add('is-active');

            const parentGroup = activeLink.closest('.toc-group');
            if (parentGroup) {
                parentGroup.classList.add('expanded');
            }

            activeLink.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        function addCopyButtons() {
            document.querySelectorAll('pre').forEach((preElement) => {
                if (preElement.parentElement.classList.contains('code-block-wrapper')) return;
                const wrapper = document.createElement('div');
                wrapper.className = 'code-block-wrapper';
                preElement.parentNode.insertBefore(wrapper, preElement);
                wrapper.appendChild(preElement);

                const button = document.createElement('button');
                button.className = 'copy-btn';
                button.innerText = '复制';
                button.addEventListener('click', () => {
                    const code = preElement.querySelector('code').innerText;
                    navigator.clipboard.writeText(code).then(() => {
                        button.innerText = '已复制';
                        setTimeout(() => button.innerText = '复制', 2000);
                    });
                });
                wrapper.appendChild(button);
            });
        }
    </script>
